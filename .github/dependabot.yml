version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(backend)"
    # Las versiones grandes rompen el CI o cambian el comportamiento: se hacen a mano,
    # con una historia y prueba en el navegador, no desde un PR automático.
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web-admin
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(web-admin)"
    # Las versiones grandes rompen el CI o cambian el comportamiento: se hacen a mano,
    # con una historia y prueba en el navegador, no desde un PR automático.
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /pwa-tecnico
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(pwa)"
    # Las versiones grandes rompen el CI o cambian el comportamiento: se hacen a mano,
    # con una historia y prueba en el navegador, no desde un PR automático.
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    # La imagen sigue la versión de Python del backend (3.12): un salto de Python (3.12 a
    # 3.15 es "minor" para la etiqueta) se hace a mano. Solo entran los parches de la imagen.
    ignore:
      - dependency-name: "python"
        update-types: [version-update:semver-major, version-update:semver-minor]
