name: Claude (revisión de PR)

# Revisión automática de cada PR contra las reglas del proyecto.
# Solo corre en PR de ramas del mismo repositorio: en repos públicos GitHub no entrega
# secretos a PR de forks, y no queremos ejecutar código de forks con claves.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Si el repo todavia no tiene cargado el secret ANTHROPIC_API_KEY, el job corre pero
    # saltea la revision (queda en verde) en vez de fallar. Al cargar el secret, vuelve a
    # correr solo, sin cambiar este archivo.
    env:
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - if: env.HAS_ANTHROPIC_KEY == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - if: env.HAS_ANTHROPIC_KEY == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Revisá el pull request ${{ github.repository }}#${{ github.event.pull_request.number }}.
            Leé CLAUDE.md y CONTRIBUTING.md y seguí el criterio del agente qa-reviewer (.claude/agents/qa-reviewer.md).

            Prioridades, en orden:
            1. Reglas de dominio: el técnico no ve precios ni historial; borrado lógico; precios estampados al usar un repuesto; fotos fuera de la base; fechas y precios en tablas de transacción.
            2. Que el PR cumpla los criterios de aceptación de la historia que referencia (docs/stories/).
            3. Seguridad: secretos, datos personales (DNI, firmas), autorización en cada endpoint, logs.
            4. Migraciones reversibles y sin pérdida de datos.
            5. Tests faltantes, errores de lógica, legibilidad.

            Comentá solo lo que importa. Un comentario en línea por problema, con el cambio sugerido.
            Si no hay problemas, dejá un solo comentario corto confirmándolo. No uses guion largo.
          claude_args: |
            --max-turns 12
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
