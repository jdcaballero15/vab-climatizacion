name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web-admin: ${{ steps.filter.outputs.web-admin }}
      pwa-tecnico: ${{ steps.filter.outputs.pwa-tecnico }}
      stories: ${{ steps.filter.outputs.stories }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            web-admin:
              - 'web-admin/**'
              - '.github/workflows/ci.yml'
            pwa-tecnico:
              - 'pwa-tecnico/**'
              - '.github/workflows/ci.yml'
            stories:
              - 'docs/stories/**'
              - 'docs/domain/decisiones-pendientes.md'
              - 'scripts/validate_stories.py'
              - 'scripts/stories_lib.py'

  backend:
    name: backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ot
          POSTGRES_PASSWORD: ot
          POSTGRES_DB: ot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ot -d ot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://ot:ot@localhost:5432/ot_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      # Bucket S3 compatible para los tests de archivos (E00-09). MinIO dejó de publicar
      # imágenes y binarios; queda el paquete de Homebrew (deshabilitado desde 2027-02-17).
      - name: Levantar MinIO
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install minio
          mkdir -p "$RUNNER_TEMP/minio"
          MINIO_ROOT_USER=minio MINIO_ROOT_PASSWORD=minio12345 \
            nohup "$(brew --prefix)/bin/minio" server "$RUNNER_TEMP/minio" --address :9000 \
            > "$RUNNER_TEMP/minio.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/minio.log"; exit 1
      # Las copias de E00-07 usan pg_dump y pg_restore: tienen que ser de Postgres 16.
      - run: pg_dump --version && pg_restore --version
      - run: pytest

  backend-image:
    name: backend-image
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # La imagen que corre en Render (API y cron de copias): que construya y traiga pg_dump 18, la versión de la base.
      - run: docker build -t vab-ot-api backend
      - run: docker run --rm vab-ot-api pg_dump --version | grep -q "PostgreSQL) 18\."

  web-admin:
    name: web-admin
    needs: changes
    if: needs.changes.outputs.web-admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-admin
    steps:
      - uses: actions/checkout@v7
      - name: Detectar si la app ya fue creada
        id: scaffold
        run: |
          if [ -f package-lock.json ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "web-admin todavia no tiene package-lock.json, se omite."; fi
      - uses: actions/setup-node@v7
        if: steps.scaffold.outputs.ready == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-admin/package-lock.json
      - if: steps.scaffold.outputs.ready == 'true'
        run: npm ci
      - if: steps.scaffold.outputs.ready == 'true'
        run: npm run lint --if-present
      - if: steps.scaffold.outputs.ready == 'true'
        run: npm run typecheck --if-present
      - if: steps.scaffold.outputs.ready == 'true'
        run: npm test --if-present
      - if: steps.scaffold.outputs.ready == 'true'
        run: npm run build --if-present

  pwa-tecnico:
    name: pwa-tecnico
    needs: changes
    if: needs.changes.outputs.pwa-tecnico == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwa-tecnico
    steps:
      - uses: actions/checkout@v7
      - name: Detectar si la app ya fue creada
        id: scaffold
        run: |
          if [ -f package-lock.json ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "pwa-tecnico todavia no tiene package-lock.json, se omite."; fi
      - uses: actions/setup-node@v7
        if: steps.scaffold.outputs.ready == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pwa-tecnico/package-lock.json
      - if: steps.scaffold.outputs.ready == 'true'
        run: npm ci
      - if: steps.scaffold.outputs.ready == 'true'
        run: npm run lint --if-present
      - if: steps.scaffold.outputs.ready == 'true'
        run: npm run typecheck --if-present
      - if: steps.scaffold.outputs.ready == 'true'
        run: npm test --if-present
      - if: steps.scaffold.outputs.ready == 'true'
        run: npm run build --if-present

  stories:
    name: stories
    needs: changes
    if: needs.changes.outputs.stories == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/validate_stories.py --check-index

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # CLI directo: la accion oficial pide licencia en repositorios de organizaciones.
      - name: Escanear secretos con gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose

  conventions:
    name: conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Titulo del PR en Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$TITLE" | grep -Eq '^(feat|fix|docs|refactor|test|chore|perf|ci)(\([a-z0-9_-]+\))?!?: .+'; then
            echo "El titulo del PR debe ser Conventional Commits, por ejemplo: feat(backend): asignar orden (E04-03)"
            exit 1
          fi
      - name: Nombre de rama
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if ! echo "$BRANCH" | grep -Eq '^(feat|fix|docs|chore|refactor|test|ci|perf|dependabot|claude)/.+'; then
            echo "La rama '$BRANCH' no sigue el esquema tipo/descripcion (ver CONTRIBUTING.md)."
            exit 1
          fi

  guards:
    name: guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash .claude/hooks/test_guards.sh

  # Unico check requerido en la proteccion de rama. Pasa si los jobs que corrieron pasaron
  # y tambien si se omitieron (por filtro de rutas).
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, backend, backend-image, web-admin, pwa-tecnico, stories, secrets, conventions, guards]
    runs-on: ubuntu-latest
    steps:
      - name: Verificar resultado de los jobs
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ join(needs.*.result, ' ') }}' | grep -Eq 'failure|cancelled'; then
            echo "Hay jobs fallidos."
            exit 1
          fi
