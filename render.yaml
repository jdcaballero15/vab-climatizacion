# Blueprint de Render (E00-05, ADR 0004): base, API, administración y app del técnico.
# Paso a paso y lo que hay que revisar después de crearlo: docs/workflow/despliegue.md.
# Ninguna credencial va acá: la clave la genera Render y la base se conecta sola.
#
# Las direcciones públicas salen del nombre de cada servicio (https://<nombre>.onrender.com).
# Si Render le agrega un sufijo a un nombre por estar ocupado, hay que corregir
# CORS_ORIGINS y VITE_API_URL con las direcciones reales.

databases:
  - name: vab-ot-db
    databaseName: ot
    user: ot
    plan: basic-256mb
    region: virginia
    postgresMajorVersion: "16"
    ipAllowList: [] # solo desde Render; para importar desde afuera se habilita un rato

services:
  - type: web
    name: vab-ot-api
    runtime: docker
    plan: starter
    region: virginia
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vab-ot-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://vab-ot-admin.onrender.com,https://vab-ot-tecnico.onrender.com

  - type: web
    name: vab-ot-admin
    runtime: static
    rootDir: web-admin
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      # La API por /api del mismo sitio: la cookie del refresh token es del mismo sitio (ADR 0010).
      - key: VITE_API_URL
        value: /api
    routes:
      # Antes que la de index.html: reenvía las llamadas a la API sin el prefijo /api.
      - type: rewrite
        source: /api/*
        destination: https://vab-ot-api.onrender.com/*
      # Las rutas de la app (/ordenes, /clientes) las resuelve React.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache

  - type: web
    name: vab-ot-tecnico
    runtime: static
    rootDir: pwa-tecnico
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      # La API por /api del mismo sitio: la cookie del refresh token es del mismo sitio (ADR 0010).
      - key: VITE_API_URL
        value: /api
    routes:
      # Antes que la de index.html: reenvía las llamadas a la API sin el prefijo /api.
      - type: rewrite
        source: /api/*
        destination: https://vab-ot-api.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Sin caché para que el celular vea enseguida que hay una versión nueva (E00-03).
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
